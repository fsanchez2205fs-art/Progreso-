<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mi Progreso Físico</title>
  
  <!-- Iconos para la pantalla de inicio de Android e iPhone -->
  <link rel="apple-touch-icon" href="https://img.icons8.com/isometric/512/dumbbell.png">
  <link rel="icon" type="image/png" href="https://img.icons8.com/isometric/512/dumbbell.png">
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .bg-card { background-color: #1e293b; }
    .accent-color { color: #10b981; }
    .accent-bg { background-color: #10b981; }
  </style>
</head>
<body class="pb-24 min-h-screen">

  <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-10 shadow-lg">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2 text-emerald-400">
        <i class="fa-solid fa-chart-line"></i> Progreso Físico
      </h1>
      <button onclick="toggleSettings()" class="text-slate-400 hover:text-white text-lg">
        <i class="fa-solid fa-gear"></i>
      </button>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">

    <section class="bg-card rounded-2xl p-4 border border-slate-800 shadow-xl">
      <div class="flex justify-between items-center mb-4">
        <label for="metricSelect" class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Métrica</label>
        <select id="metricSelect" onchange="updateChart()" class="bg-slate-900 text-emerald-400 font-bold text-sm rounded-lg px-3 py-1.5 border border-slate-700 outline-none">
          <option value="peso">Peso (kg)</option>
          <option value="pecho">Diámetro Pecho (cm)</option>
          <option value="cintura">Diámetro Cintura (cm)</option>
          <option value="abdomen">Diámetro Abdominal (cm)</option>
          <option value="cadera">Diámetro Cadera (cm)</option>
          <option value="brazo">Brazo Dominante (cm)</option>
          <option value="muslo">Muslo Dominante (cm)</option>
          <option value="gemelo">Gemelo Dominante (cm)</option>
        </select>
      </div>

      <div class="relative h-64 w-full">
        <canvas id="progressChart"></canvas>
      </div>

      <div class="flex justify-around mt-4 pt-3 border-t border-slate-800/80 text-xs text-slate-400">
        <button onclick="setFilter('1M')" class="filter-btn px-3 py-1 rounded-full hover:bg-slate-800" data-range="1M">1 Mes</button>
        <button onclick="setFilter('3M')" class="filter-btn px-3 py-1 rounded-full hover:bg-slate-800" data-range="3M">3 Meses</button>
        <button onclick="setFilter('6M')" class="filter-btn px-3 py-1 rounded-full hover:bg-slate-800" data-range="6M">6 Meses</button>
        <button onclick="setFilter('ALL')" class="filter-btn px-3 py-1 rounded-full bg-slate-800 text-emerald-400 font-semibold" data-range="ALL">Todo</button>
      </div>
    </section>

    <section>
      <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-3 px-1">Historial de Registros</h2>
      <div id="recordsList" class="space-y-3"></div>
    </section>

  </main>

  <button onclick="openModal()" class="fixed bottom-6 right-6 accent-bg text-slate-950 font-bold w-14 h-14 rounded-full shadow-2xl flex items-center justify-center text-2xl hover:scale-105 transition-transform">
    <i class="fa-solid fa-plus"></i>
  </button>

  <div id="entryModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-slate-900 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 border border-slate-800 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-6">
        <h3 class="text-lg font-bold text-white">Nuevo Registro</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <form id="metricsForm" onsubmit="saveEntry(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Fecha</label>
          <input type="date" id="inputDate" required class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white focus:border-emerald-500 outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Peso (kg)</label>
            <input type="number" step="0.1" id="inputPeso" placeholder="0.0" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white focus:border-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">D. Pecho (cm)</label>
            <input type="number" step="0.1" id="inputPecho" placeholder="0.0" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white focus:border-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">D. Cintura (cm)</label>
            <input type="number" step="0.1" id="inputCintura" placeholder="0.0" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white focus:border-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">D. Abdominal (cm)</label>
            <input type="number" step="0.1" id="inputAbdomen" placeholder="0.0" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white focus:border-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">D. Cadera (cm)</label>
            <input type="number" step="0.1" id="inputCadera" placeholder="0.0" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white focus:border-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Brazo Dom. (cm)</label>
            <input type="number" step="0.1" id="inputBrazo" placeholder="0.0" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white focus:border-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Muslo Dom. (cm)</label>
            <input type="number" step="0.1" id="inputMuslo" placeholder="0.0" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white focus:border-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Gemelo Dom. (cm)</label>
            <input type="number" step="0.1" id="inputGemelo" placeholder="0.0" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white focus:border-emerald-500 outline-none">
          </div>
        </div>

        <button type="submit" class="w-full accent-bg text-slate-950 font-bold py-3.5 rounded-xl mt-4 text-base hover:opacity-90 transition-opacity">
          Guardar Registro
        </button>
      </form>
    </div>
  </div>

  <div id="settingsModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 w-full max-w-sm rounded-2xl p-6 border border-slate-800 space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="text-lg font-bold text-white">Opciones de Datos</h3>
        <button onclick="closeSettings()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <div class="space-y-3 pt-2">
        <button onclick="exportData()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-semibold py-3 px-4 rounded-xl flex items-center gap-3 text-sm">
          <i class="fa-solid fa-download text-emerald-400"></i> Exportar Copia (JSON)
        </button>
        <button onclick="document.getElementById('importFile').click()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-semibold py-3 px-4 rounded-xl flex items-center gap-3 text-sm">
          <i class="fa-solid fa-upload text-emerald-400"></i> Importar Copia (JSON)
        </button>
        <input type="file" id="importFile" accept=".json" class="hidden" onchange="importData(event)">
        
        <button onclick="loadDemoData()" class="w-full bg-slate-800 hover:bg-slate-700 text-amber-400 font-semibold py-3 px-4 rounded-xl flex items-center gap-3 text-sm">
          <i class="fa-solid fa-vial"></i> Cargar Datos de Ejemplo
        </button>

        <button onclick="clearAllData()" class="w-full bg-red-950/40 hover:bg-red-900/50 text-red-400 border border-red-900/50 font-semibold py-3 px-4 rounded-xl flex items-center gap-3 text-sm mt-4">
          <i class="fa-solid fa-trash"></i> Borrar Todo
        </button>
      </div>
    </div>
  </div>

  <script>
    let entries = JSON.parse(localStorage.getItem('fitnessEntries')) || [];
    let currentFilter = 'ALL';
    let chartInstance = null;

    const metricLabels = {
      peso: 'Peso (kg)',
      pecho: 'Diámetro Pecho (cm)',
      cintura: 'Diámetro Cintura (cm)',
      abdomen: 'Diámetro Abdominal (cm)',
      cadera: 'Diámetro Cadera (cm)',
      brazo: 'Brazo Dominante (cm)',
      muslo: 'Muslo Dominante (cm)',
      gemelo: 'Gemelo Dominante (cm)'
    };

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('inputDate').valueAsDate = new Date();
      initChart();
      renderRecords();
    });

    function initChart() {
      const ctx = document.getElementById('progressChart').getContext('2d');
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [{ label: '', data: [], borderColor: '#10b981', backgroundColor: 'rgba(16, 185, 129, 0.1)', borderWidth: 3, tension: 0.3, fill: true, pointBackgroundColor: '#10b981', pointRadius: 4 }] },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#94a3b8' } },
            y: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#94a3b8' } }
          }
        }
      });
      updateChart();
    }

    function updateChart() {
      if (!chartInstance) return;
      const key = document.getElementById('metricSelect').value;
      let filtered = [...entries].sort((a,b) => new Date(a.date) - new Date(b.date));

      if (currentFilter !== 'ALL') {
        const now = new Date();
        const months = currentFilter === '1M' ? 1 : currentFilter === '3M' ? 3 : 6;
        const limitDate = new Date(now.setMonth(now.getMonth() - months));
        filtered = filtered.filter(e => new Date(e.date) >= limitDate);
      }

      const validEntries = filtered.filter(e => e[key] !== undefined && e[key] !== null && e[key] !== '');
      chartInstance.data.labels = validEntries.map(e => formatDate(e.date));
      chartInstance.data.datasets[0].data = validEntries.map(e => e[key]);
      chartInstance.data.datasets[0].label = metricLabels[key];
      chartInstance.update();
    }

    function renderRecords() {
      const container = document.getElementById('recordsList');
      container.innerHTML = '';
      const sorted = [...entries].sort((a,b) => new Date(b.date) - new Date(a.date));

      if (sorted.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-slate-500 text-sm"><i class="fa-solid fa-inbox text-3xl mb-2"></i><p>No hay registros guardados.</p></div>`;
        return;
      }

      sorted.forEach(entry => {
        const div = document.createElement('div');
        div.className = 'bg-card p-4 rounded-xl border border-slate-800 space-y-2';
        let metricsHtml = '';

        Object.keys(metricLabels).forEach(key => {
          if (entry[key]) {
            metricsHtml += `
              <div class="flex justify-between items-center text-xs py-1 border-b border-slate-800/50 last:border-0">
                <span class="text-slate-400">${metricLabels[key]}</span>
                <span class="font-bold text-slate-200">${entry[key]}</span>
              </div>`;
          }
        });

        div.innerHTML = `
          <div class="flex justify-between items-center border-b border-slate-800 pb-2">
            <span class="font-bold text-emerald-400 text-sm"><i class="fa-regular fa-calendar-check mr-1"></i> ${formatDate(entry.date)}</span>
            <button onclick="deleteEntry('${entry.id}')" class="text-slate-500 hover:text-red-400 p-1"><i class="fa-solid fa-trash-can"></i></button>
          </div>
          <div class="pt-1">${metricsHtml}</div>
        `;
        container.appendChild(div);
      });
    }

    function saveEntry(e) {
      e.preventDefault();
      const date = document.getElementById('inputDate').value;
      const keys = ['peso', 'pecho', 'cintura', 'abdomen', 'cadera', 'brazo', 'muslo', 'gemelo'];
      let newEntry = { id: Date.now().toString(), date };

      keys.forEach(k => {
        const val = document.getElementById('input' + k.charAt(0).toUpperCase() + k.slice(1)).value;
        if (val) newEntry[k] = parseFloat(val);
      });

      entries.push(newEntry);
      localStorage.setItem('fitnessEntries', JSON.stringify(entries));
      closeModal();
      document.getElementById('metricsForm').reset();
      document.getElementById('inputDate').valueAsDate = new Date();
      updateChart();
      renderRecords();
    }

    function deleteEntry(id) {
      if (confirm('¿Borrar este registro?')) {
        entries = entries.filter(e => e.id !== id);
        localStorage.setItem('fitnessEntries', JSON.stringify(entries));
        updateChart();
        renderRecords();
      }
    }

    function setFilter(range) {
      currentFilter = range;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.dataset.range === range) {
          btn.className = 'filter-btn px-3 py-1 rounded-full bg-slate-800 text-emerald-400 font-semibold';
        } else {
          btn.className = 'filter-btn px-3 py-1 rounded-full hover:bg-slate-800 text-slate-400';
        }
      });
      updateChart();
    }

    function formatDate(dStr) {
      const parts = dStr.split('-');
      return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    function openModal() { document.getElementById('entryModal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('entryModal').classList.add('hidden'); }
    function toggleSettings() { document.getElementById('settingsModal').classList.remove('hidden'); }
    function closeSettings() { document.getElementById('settingsModal').classList.add('hidden'); }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(entries, null, 2));
      const a = document.createElement('a');
      a.setAttribute("href", dataStr);
      a.setAttribute("download", `progreso_fisico_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const data = JSON.parse(evt.target.result);
          if (Array.isArray(data)) {
            entries = data;
            localStorage.setItem('fitnessEntries', JSON.stringify(entries));
            updateChart();
            renderRecords();
            closeSettings();
            alert('Datos importados con éxito');
          }
        } catch (err) { alert('Error al leer el archivo JSON'); }
      };
      reader.readAsText(file);
    }

    function loadDemoData() {
      entries = [
        { id: '1', date: '2026-08-01', peso: 78.5, pecho: 102, cintura: 86, abdomen: 88, cadera: 98, brazo: 35, muslo: 58, gemelo: 37 },
        { id: '2', date: '2026-09-01', peso: 77.2, pecho: 103, cintura: 84, abdomen: 86, cadera: 97, brazo: 35.5, muslo: 58.5, gemelo: 37 },
        { id: '3', date: '2026-10-01', peso: 76.0, pecho: 104, cintura: 82, abdomen: 84, cadera: 96, brazo: 36, muslo: 59, gemelo: 37.5 }
      ];
      localStorage.setItem('fitnessEntries', JSON.stringify(entries));
      updateChart();
      renderRecords();
      closeSettings();
    }

    function clearAllData() {
      if (confirm('¿Seguro que deseas borrar todos los registros?')) {
        entries = [];
        localStorage.removeItem('fitnessEntries');
        updateChart();
        renderRecords();
        closeSettings();
      }
    }
  </script>
</body>
</html>
